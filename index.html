<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verso la Mezza GPS</title>
<meta name="theme-color" content="#D6336C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VLM GPS">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,600,100;0,9..144,800,100;1,9..144,600,100&family=Nunito:wght@400;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: una colonna a tutto schermo; in corsa il quadrante del tratto domina, sotto distanza e passo, mappa ridotta */
:root{
  --bg:#FCF5F6; --surface:#FFFFFF; --sunk:#F7E9EE; --ink:#3B1F35; --muted:#806676; --line:#EFD9E1;
  --accent:#D6336C; --accent-soft:#FCE3EC; --on-accent:#FFFFFF;
  --lilac:#8C76D6; --lilac-soft:#EEEAFB; --peach-soft:#FDEDE3; --walk:#D8C3CF;
  --ok:#2C8A66; --ok-soft:#E0F3EB; --warn:#C2410C; --warn-soft:#FDEBE1;
  --f-display:"Fraunces",Georgia,serif; --f-body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1B1219; --surface:#261A23; --sunk:#31222D; --ink:#F7E9EF; --muted:#C0A7B6; --line:#3E2C38;
  --accent:#FF7EA6; --accent-soft:#4A2236; --on-accent:#1B1219;
  --lilac:#B8A7F6; --lilac-soft:#2F2846; --peach-soft:#3A2A22; --walk:#6B5664;
  --ok:#6FD3A8; --ok-soft:#18302A; --warn:#FF9E7A; --warn-soft:#3E241E; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body{padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.05;font-variation-settings:"SOFT" 100;text-wrap:balance}
h1{font-size:2rem;font-style:italic}
h2{font-size:1.5rem}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.875rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.block{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
button,select{font:inherit;color:inherit}
.btn{border:0;border-radius:99px;padding:13px 18px;font-weight:800;min-height:48px;background:var(--sunk);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.lilac{background:var(--lilac);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1 1 130px}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg)}
.note{border-radius:16px;padding:12px 14px;font-size:.92rem}.note b{display:block}
.note.warn{background:var(--warn-soft)}.note.warn b{color:var(--warn)}
.note.ok{background:var(--ok-soft)}.note.info{background:var(--sunk)}
.gps{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.85rem}
.gps i{width:10px;height:10px;border-radius:50%;background:var(--walk)}
.gps.good i{background:var(--ok)}.gps.mid i{background:#E0A100}.gps.bad i{background:var(--warn)}
.segs{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.segs i{display:block;height:100%}.segs .run{background:var(--accent)}.segs .walk{background:var(--walk)}.segs .warm,.segs .cool{background:#F6B48F}
.face{border-radius:30px;padding:18px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.face.run{background:var(--accent);color:var(--on-accent)}.face.fast{background:#E26C59;color:#fff}.segs .fast{background:#E26C59}.face.walk{background:var(--sunk)}.face.warm,.face.cool{background:var(--peach-soft)}
.what{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,9vw,2.8rem);line-height:1}
.clock{font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,22vw,6.5rem);line-height:.9}
.nx{font-size:.95rem;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1}
.stats small{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
progress{width:100%;height:8px;accent-color:var(--accent)}
.map{height:220px;border-radius:18px;overflow:hidden;border:1px solid var(--line);isolation:isolate}
.map.big{height:320px}
.code{width:100%;min-height:80px;font:12px/1.3 ui-monospace,monospace;border:1.5px solid var(--line);border-radius:14px;padding:10px;background:var(--bg);color:var(--ink);word-break:break-all}
ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== Piano (uguale a Verso la Mezza) ===== */
const R=s=>({t:'run',s}),Wk=s=>({t:'walk',s}),B=(n,...steps)=>({n,steps});
const WEEKS=[
 {A:[B(2,R(120),Wk(90),R(180),Wk(120))],B:[B(4,R(180),Wk(120))],C:[B(3,R(300),Wk(120))]},
 {A:[B(3,R(300),Wk(90))],B:[B(3,R(360),Wk(120))],C:[B(2,R(480),Wk(90))]},
 {A:[B(3,R(420),Wk(90))],B:[B(2,R(600),Wk(120))],C:[B(2,R(720),Wk(120))]},
 {A:[B(3,R(360),Wk(90))],B:[B(2,R(480),Wk(90))],C:[B(2,R(720),Wk(120))]},
 {A:[B(1,R(900),Wk(120)),B(1,R(480))],B:[B(2,R(600),Wk(60))],C:[B(1,R(1080),Wk(120)),B(1,R(480))]},
 {A:[B(1,R(1200))],B:[B(2,R(720),Wk(60))],C:[B(1,R(1320))]},
 {A:[B(1,R(1320))],B:[B(1,R(1200))],C:[B(1,R(1500))]},
 {A:[B(1,R(1500))],B:[B(1,R(1200))],C:[B(1,R(1800))],test:true},
];
const NW=WEEKS.length, SN={r1:"Corsa 1",r2:"Corsa 2",r3:"Corsa lunga",free:"Corsa libera"};
function fdur(s){const m=Math.floor(s/60),r=s%60;return m?(m+"′"+(r?r+"″":"")):r+"″"}
function spec(w,k){
  const PS=P.get("s");if(PS&&k!=="free"){const M={W:"warm",r:"run",w:"walk",c:"cool",f:"fast"},segs=PS.split(".").map(x=>({t:M[x[0]],s:+x.slice(1)})).filter(x=>x.t&&x.s>0);if(segs.length)return {title:P.get("t")||"Corsa",d:segs.slice(1,-1).map(x=>fdur(x.s)+(x.t==="walk"?" cammino":x.t==="fast"?" veloce":" corsa")).join(" + "),segs};}
  if(k==="free")return {title:"Corsa libera",d:"Senza piano: il timer conta e basta",segs:[{t:'run',s:4*3600}],free:true};
  const W=WEEKS[Math.min(Math.max(w,0),NW-1)],bl=k==="r1"?W.A:k==="r2"?W.B:W.C,seg=[];
  bl.forEach(b=>{for(let i=0;i<b.n;i++)b.steps.forEach(x=>seg.push({t:x.t,s:x.s}))});
  const cont=bl.length===1&&bl[0].n===1&&bl[0].steps.length===1;
  const d=cont?fdur(bl[0].steps[0].s)+" di corsa continua":bl.map(b=>(b.n>1?b.n+" × (":"")+b.steps.map(x=>fdur(x.s)+(x.t==="run"?" corsa":" cammino")).join(" + ")+(b.n>1?")":"")).join(" + ");
  return {title:k==="r3"?(W.test?"Test 3–4 km":"Corsa lunga"):cont?"Corsa facile":"Camminata/corsa",d,segs:[{t:'warm',s:300},...seg,{t:'cool',s:300}]};
}

/* ===== Utilità ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(v,d=2)=>(Math.round(v*10**d)/10**d).toFixed(d).replace(".",",");
const clk=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(r).padStart(2,"0")};
const pace=(km,sec)=>{if(!km||km<0.02||!sec)return "–";const p=sec/km;if(p>1800)return "–";return Math.floor(p/60)+":"+String(Math.round(p%60)).padStart(2,"0")};
function hav(a,b){const R=6371000,r=Math.PI/180,dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;const h=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)))}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const LS="vlm_gps_run";
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsSet(v){try{v?localStorage.setItem(LS,JSON.stringify(v)):localStorage.removeItem(LS)}catch(e){}}

/* ===== Parametri dal link di Verso la Mezza ===== */
const P=new URLSearchParams(location.search);
let pick={w:Math.min(NW-1,Math.max(0,(+P.get("w")||0))),k:["r1","r2","r3","free"].includes(P.get("k"))?P.get("k"):"r1"};
const fromApp=P.has("k");

/* ===== Stato corsa ===== */
let RUN=null, watchId=null, lastFix=null, tick=null, wl=null, map=null, poly=null, me=null, hiddenAt=null;
function newRun(){
  const sp=spec(pick.w,pick.k);
  return {v:1,w:pick.w,k:pick.k,title:sp.title,segs:sp.segs,free:!!sp.free,startedAt:Date.now(),active:0,lastT:Date.now(),running:true,
    idx:0,dist:0,segKm:sp.segs.map(()=>0),segSec:sp.segs.map(()=>0),splits:[],lastSplitAt:0,pts:[],gaps:0,done:false,announced:-1};
}
function segAt(e){let a=0;for(let i=0;i<RUN.segs.length;i++){if(e<a+RUN.segs[i].s)return {i,left:a+RUN.segs[i].s-e};a+=RUN.segs[i].s}return {i:RUN.segs.length,left:0}}
const total=()=>RUN.segs.reduce((a,x)=>a+x.s,0);

/* ===== Suoni e voce ===== */
let AC=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function beep(n=2){try{for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*.25;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.45,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=1;speechSynthesis.speak(u)}catch(e){}}
const LBL={warm:"Riscaldamento",run:"Corri piano",walk:"Cammina",cool:"Defaticamento",fast:"Ritmo sostenuto"};
const VOICE={warm:"Riscaldamento: cammina veloce per",run:"Corri, ritmo facile, per",walk:"Cammina per",cool:"Defaticamento: cammina per",fast:"Ritmo sostenuto per"};
function vdur(s){const m=Math.floor(s/60),r=s%60;return (m?m+(m===1?" minuto":" minuti"):"")+(m&&r?" e ":"")+(r?r+" secondi":"")}

/* ===== GPS ===== */
function startGps(){
  if(!("geolocation" in navigator)){gpsMsg("Questo browser non dà accesso al GPS.");return}
  if(watchId!=null)return;
  watchId=navigator.geolocation.watchPosition(onFix,err=>{gpsMsg(err.code===1?"Hai negato la posizione. Attivala per questo sito in Impostazioni › Privacy › Localizzazione › Siti web di Safari.":"Segnale GPS non disponibile, riprovo…")},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
function stopGps(){if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}}
let gpsNote="";
function gpsMsg(t){gpsNote=t;const n=$("gpsnote");if(n){n.textContent=t;n.hidden=!t}}
function onFix(p){
  const c=p.coords,pt=[+c.latitude.toFixed(6),+c.longitude.toFixed(6),Date.now(),Math.round(c.accuracy)];
  lastFix=pt;gpsMsg("");updGpsBadge();
  if(!RUN||!RUN.running||RUN.done){if(map&&!RUN)follow(pt);return}
  if(c.accuracy>40)return;
  const prev=RUN.pts[RUN.pts.length-1];
  if(prev){const d=hav(prev,pt),dt=(pt[2]-prev[2])/1000;if(dt<=0)return;if(d/dt>8&&dt<30)return;if(d<1.5)return;
    if(dt<30){const si=segAt(RUN.active).i;RUN.dist+=d;if(si<RUN.segKm.length)RUN.segKm[si]+=d/1000;
      const km=Math.floor(RUN.dist/1000);if(km>RUN.splits.length){RUN.splits.push(Math.round(RUN.active-RUN.lastSplitAt));RUN.lastSplitAt=RUN.active}}
    else RUN.gaps++;}
  RUN.pts.push(pt);
  if(poly)poly.addLatLng([pt[0],pt[1]]);follow(pt);
}
function updGpsBadge(){const b=$("gps");if(!b)return;const a=lastFix&&Date.now()-lastFix[2]<15000?lastFix[3]:null;b.className="gps "+(a==null?"":a<=15?"good":a<=35?"mid":"bad");b.innerHTML="<i></i>"+(a==null?"Cerco il GPS…":"GPS ±"+a+" m")}
function follow(pt){if(!map)return;if(!me)me=L.circleMarker([pt[0],pt[1]],{radius:7,color:"#fff",weight:3,fillColor:"#D6336C",fillOpacity:1}).addTo(map);else me.setLatLng([pt[0],pt[1]]);if(!RUN||RUN.running)map.panTo([pt[0],pt[1]],{animate:false})}
function makeMap(el,big){
  if(!window.L||!el)return null;
  const m=L.map(el,{zoomControl:false,attributionControl:true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(m);
  m.attributionControl.setPrefix(false);
  const c=lastFix||[43.8777,11.1022];m.setView([c[0],c[1]],16);return m;
}

/* ===== Wake lock ===== */
async function wake(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){hiddenAt=Date.now();save()}
  else{if(RUN&&!RUN.done){wake();if(hiddenAt&&Date.now()-hiddenAt>8000){showGapNote(Math.round((Date.now()-hiddenAt)/1000))}}hiddenAt=null}
});
function showGapNote(s){const n=$("gapnote");if(n){n.hidden=false;n.innerHTML=`<b>La traccia si è fermata per ${clk(s)}</b>Con lo schermo bloccato iPhone sospende il GPS delle pagine web. Il tempo è giusto; la distanza di quel tratto manca. Tieni lo schermo acceso.`}}

/* ===== Ciclo del timer ===== */
function loop(){
  if(!RUN||RUN.done)return;const now=Date.now(),dt=(now-RUN.lastT)/1000;RUN.lastT=now;
  if(RUN.running){const si=segAt(RUN.active).i;RUN.active+=dt;if(si<RUN.segSec.length)RUN.segSec[si]+=dt}
  const s=segAt(RUN.active);
  if(s.i!==RUN.idx){RUN.idx=s.i;if(s.i>=RUN.segs.length){beep(3);say("Allenamento finito. Brava!");finish();return}beep(2);announce();drawRun();return}
  if(!RUN.free&&RUN.running&&Math.round(s.left)===10&&RUN.announced!==s.i*1000+10){RUN.announced=s.i*1000+10;const nx=RUN.segs[s.i+1];say(nx?"Tra dieci secondi: "+LBL[nx.t].toLowerCase():"Ultimi dieci secondi")}
  upd(s);
  if(Math.floor(RUN.active)%5===0)save();
}
function announce(){const c=RUN.segs[RUN.idx];if(!c)return;say(RUN.free?"Via!":VOICE[c.t]+" "+vdur(c.s))}
function save(){if(RUN)lsSet(RUN)}

/* ===== Viste ===== */
function segBar(segs){const T=segs.reduce((a,x)=>a+x.s,0);return `<div class="segs" aria-hidden="true">${segs.map(x=>`<i class="${x.t}" style="flex:${x.s/T}"></i>`).join("")}</div>`}
function home(){
  stopMap();
  const saved=lsGet();
  if(saved&&!saved.done&&Date.now()-saved.lastT<3*3600*1000){
    $("app").innerHTML=`<h1>Verso la Mezza GPS</h1><div class="block"><h2>Hai una corsa in sospeso</h2><p class="muted">${esc(SN[saved.k])} · ${esc(saved.title)} · ${num(saved.dist/1000)} km in ${clk(saved.active)}</p><div class="btns"><button class="btn primary" data-a="resume">Riprendi</button><button class="btn ghost" data-a="finishSaved">Chiudila e salva</button></div><button class="btn ghost" data-a="discard">Eliminala</button></div>`;return;
  }
  if(saved&&saved.done){RUN=saved;summary();return}
  const sp=spec(pick.w,pick.k),tot=sp.segs.reduce((a,x)=>a+x.s,0);
  $("app").innerHTML=`<div class="row between"><h1>Verso la Mezza GPS</h1><span class="gps" id="gps"><i></i>Cerco il GPS…</span></div>
   <div class="block">
    <div><p class="label">${esc(SN[pick.k])}${sp.free?"":" · settimana "+(pick.w+1)}</p><h2>${esc(sp.title)}</h2>${sp.free?"":`<p class="muted">${esc(sp.d)} · ${Math.round(tot/60)}′ con riscaldamento e defaticamento</p>`}</div>
    ${sp.free?"":segBar(sp.segs)}
    ${fromApp?"":`<div class="row" style="flex-wrap:nowrap"><select id="selW" aria-label="Settimana">${WEEKS.map((_,i)=>`<option value="${i}" ${i===pick.w?"selected":""}>Settimana ${i+1}</option>`).join("")}</select><select id="selK" aria-label="Corsa">${Object.keys(SN).map(k=>`<option value="${k}" ${k===pick.k?"selected":""}>${SN[k]}</option>`).join("")}</select></div>`}
    <div class="map" id="map"></div>
    <p class="note warn" id="gpsnote" ${gpsNote?"":"hidden"}>${esc(gpsNote)}</p>
    <button class="btn primary" data-a="start">Inizia la corsa</button>
   </div>
   <div class="note info"><b>Per una traccia completa</b>Tieni la pagina aperta e lo schermo acceso: l'app impedisce lo spegnimento automatico, ma se blocchi il telefono iPhone sospende il GPS. Il timer ti parla, quindi puoi tenere il telefono in tasca a schermo acceso.</div>`;
  map=makeMap($("map"));if(lastFix)follow(lastFix);
  startGps();updGpsBadge();
}
function stopMap(){if(map){try{map.remove()}catch(e){}map=null;poly=null;me=null}}
function drawRun(){
  stopMap();
  const s=segAt(RUN.active),c=RUN.segs[s.i]||RUN.segs[RUN.segs.length-1],nx=RUN.segs[s.i+1];
  const runN=RUN.segs.filter(x=>x.t==="run").length,runI=RUN.segs.slice(0,s.i+1).filter(x=>x.t==="run").length;
  $("app").innerHTML=`<div class="row between"><span class="label">${esc(RUN.title)}${c.t==="run"&&runN>1?" · corsa "+runI+" di "+runN:""}</span><span class="gps" id="gps"><i></i></span></div>
   ${RUN.free?"":`<progress id="pg" max="${total()}" value="${RUN.active}"></progress>`}
   <div class="face ${RUN.free?"run":c.t}"><div class="what">${RUN.free?"Corsa libera":LBL[c.t]}</div><div class="clock" id="clk">${RUN.free?clk(RUN.active):clk(s.left)}</div>${RUN.free?"":`<p class="nx">${nx?"poi "+LBL[nx.t].toLowerCase()+" "+fdur(nx.s):"ultimo tratto"}</p>`}</div>
   <div class="stats"><div><small>Distanza</small><b id="sd">${num(RUN.dist/1000)}</b><small>km</small></div><div><small>Passo</small><b id="sp">–</b><small>/km ora</small></div><div><small>Tempo</small><b id="st">${clk(RUN.active)}</b><small>totale</small></div></div>
   <p class="note warn" id="gpsnote" ${gpsNote?"":"hidden"}>${esc(gpsNote)}</p><p class="note warn" id="gapnote" hidden></p>
   <div class="btns"><button class="btn ghost" data-a="stop">Termina</button>${RUN.free?"":`<button class="btn ghost" data-a="skip">Salta tratto</button>`}<button class="btn ${RUN.running?"lilac":"primary"}" data-a="toggle">${RUN.running?"Pausa":"Riprendi"}</button></div>
   <div class="map" id="map"></div>`;
  map=makeMap($("map"));poly=L.polyline(RUN.pts.map(p=>[p[0],p[1]]),{color:"#D6336C",weight:5}).addTo(map);if(RUN.pts.length)follow(RUN.pts[RUN.pts.length-1]);
  updGpsBadge();upd(s);
}
function curPace(){const p=RUN.pts;if(p.length<2)return "–";const now=p[p.length-1][2];let d=0,i=p.length-1;while(i>0&&now-p[i-1][2]<=30000){d+=hav(p[i-1],p[i]);i--}const sec=(now-p[i][2])/1000;if(sec<8||Date.now()-now>10000)return "–";return pace(d/1000,sec)}
function upd(s){const set=(id,v)=>{const e=$(id);if(e)e.textContent=v};set("clk",RUN.free?clk(RUN.active):clk(s.left));set("sd",num(RUN.dist/1000));set("st",clk(RUN.active));set("sp",curPace());const pg=$("pg");if(pg)pg.value=RUN.active;updGpsBadge()}

/* ===== Fine corsa ===== */
function finish(){
  RUN.done=true;RUN.running=false;clearInterval(tick);tick=null;stopGps();try{wl&&wl.release()}catch(e){}
  const rest=RUN.dist/1000-RUN.splits.length;if(rest>0.05)RUN.splitTail=Math.round(RUN.active-RUN.lastSplitAt);
  save();summary();
}
function payload(){
  const r=RUN,segs=r.segs.map((x,i)=>({t:x.t,s:Math.round(r.segSec[i]),km:Math.round(r.segKm[i]*1000)/1000})).filter(x=>x.s>0);
  const runS=segs.filter(x=>x.t==="run"||x.t==="fast"),rs=runS.reduce((a,x)=>a+x.s,0),rk=runS.reduce((a,x)=>a+x.km,0);
  const step=Math.max(1,Math.ceil(r.pts.length/400)),track=r.pts.filter((_,i)=>i%step===0||i===r.pts.length-1).map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]);
  const st=new Date(r.startedAt),km=Math.round(r.dist/10)/100;
  return {v:1,w:r.free?null:r.w,k:r.free?null:r.k,date:iso(st),time:st.toTimeString().slice(0,5),km,totSec:Math.round(r.active),
    segs:r.free?undefined:segs,splits:r.splits.concat(r.splitTail?[r.splitTail]:[]),splitLast:Math.round((r.dist/1000-r.splits.length)*100)/100,
    vRun:rs>30&&rk>0?Math.round(rk/(rs/3600)*10)/10:undefined,maxRun:r.free?Math.round(r.active):Math.max(0,...segs.filter(x=>x.t==="run"||x.t==="fast").map(x=>x.s)),track,dur:Math.round((r.free?r.active:rs)/60)};
}
function code(){const j=JSON.stringify(payload());return "VLM1:"+btoa(unescape(encodeURIComponent(j)))}
function summary(){
  stopMap();const p=payload();
  $("app").innerHTML=`<p class="label">${esc(SN[RUN.k])} · ${esc(RUN.title)}</p><h1>Fatto!</h1>
   <div class="block"><div class="stats"><div><small>Distanza</small><b>${num(p.km)}</b><small>km</small></div><div><small>Tempo</small><b>${clk(p.totSec)}</b></div><div><small>Passo medio</small><b>${pace(p.km,p.totSec)}</b><small>/km</small></div></div>
    <div class="map big" id="map"></div>${RUN.gaps?`<p class="small muted">La traccia ha ${RUN.gaps} interruzioni: in quei tratti la distanza manca.</p>`:""}</div>
   <div class="block"><h2>Portala in Verso la Mezza</h2>
    <ol><li>Tocca "Copia la corsa".</li><li>Apri Verso la Mezza, sezione Mappe, e tocca il campo "Incolla qui la corsa dal GPS".</li><li>Incolla: la corsa si salva con traccia, km e intertempi, e ti chiede fatica e ginocchio.</li></ol>
    <button class="btn primary" data-a="copy">Copia la corsa</button><p class="small" id="copied" hidden></p>
    <textarea class="code" id="codebox" readonly hidden aria-label="Codice della corsa"></textarea>
    <button class="btn ghost" data-a="gpx">Salva anche il file GPX</button></div>
   <button class="btn ghost" data-a="new">Nuova corsa</button>`;
  map=makeMap($("map"),true);if(map&&RUN.pts.length>1){const l=L.polyline(RUN.pts.map(x=>[x[0],x[1]]),{color:"#D6336C",weight:5}).addTo(map);map.fitBounds(l.getBounds().pad(.15))}
}
function gpx(){
  const x=s=>String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
  const nm=SN[RUN.k]+" "+iso(new Date(RUN.startedAt));
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Verso la Mezza GPS" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>${x(nm)}</name><time>${new Date(RUN.startedAt).toISOString()}</time></metadata><trk><name>${x(nm)}</name><type>running</type><trkseg>${RUN.pts.map(p=>`<trkpt lat="${p[0]}" lon="${p[1]}"><time>${new Date(p[2]).toISOString()}</time></trkpt>`).join("")}</trkseg></trk></gpx>`;
}
async function saveGpx(){
  const name="Corsa "+iso(new Date(RUN.startedAt))+".gpx",file=new File([gpx()],name,{type:"application/gpx+xml"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}

/* ===== Eventi ===== */
document.addEventListener("change",e=>{if(e.target.id==="selW"||e.target.id==="selK"){pick={w:+$("selW").value,k:$("selK").value};home()}});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="start"){audio();RUN=newRun();RUN.lastT=Date.now();startGps();await wake();beep(1);announce();drawRun();tick=setInterval(loop,250);save()}
  else if(a==="toggle"){RUN.running=!RUN.running;RUN.lastT=Date.now();if(RUN.running)say("Si riparte");drawRun();save()}
  else if(a==="skip"){const s=segAt(RUN.active);const add=s.left+.01;RUN.active+=add;loop()}
  else if(a==="stop"){if(b.dataset.sure){finish()}else{b.dataset.sure="1";b.textContent="Tocca ancora per terminare";setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent="Termina"}},3000)}}
  else if(a==="resume"){audio();RUN=lsGet();RUN.lastT=Date.now();RUN.running=false;startGps();await wake();drawRun();tick=setInterval(loop,250)}
  else if(a==="finishSaved"){RUN=lsGet();finish()}
  else if(a==="discard"){if(b.dataset.sure){lsSet(null);RUN=null;home()}else{b.dataset.sure="1";b.textContent="Tocca ancora per eliminarla"}}
  else if(a==="copy"){const c=code(),box=$("codebox"),msg=$("copied");box.value=c;
    try{await navigator.clipboard.writeText(c);msg.hidden=false;msg.textContent="Copiata. Ora incollala in Verso la Mezza."}
    catch(err){box.hidden=false;box.focus();box.select();msg.hidden=false;msg.textContent="Tieni premuto sul testo qui sotto e scegli Copia."}}
  else if(a==="gpx")saveGpx();
  else if(a==="new"){if(b.dataset.sure){lsSet(null);RUN=null;home()}else{b.dataset.sure="1";b.textContent="Tocca ancora: la corsa è stata copiata?"}}
});
window.addEventListener("pagehide",save);
home();
</script>
</body>
</html>
